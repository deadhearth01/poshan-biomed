# Explicit heap. Without it the JVM sizes from total RAM rather than free RAM, and on a
# machine running a browser and an editor it asks for more than the OS can commit — the
# build then dies with "paging file is too small", which reads like a compiler failure.
# This single heap serves both Gradle and the Kotlin compiler (see execution.strategy).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx1024m

# Compile Kotlin inside the Gradle JVM rather than spawning a second one.
#
# The default strategy runs a separate Kotlin compile daemon, so a build needs two JVMs
# resident at once. On this machine that reliably loses the race for memory and the daemon
# dies mid-compile with "paging file is too small" — which surfaces as a compilation
# failure rather than as the memory failure it is. In-process is slightly slower on large
# incremental builds and does not fall over.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# Appwrite backend configuration.
#
# Deliberately not set here. build.gradle.kts resolves each key from the Gradle property
# first, then local.properties, then a harmless default — so real values live in
# local.properties, which is gitignored, and this file stays safe to publish.
#
# To configure a backend, add to android/local.properties:
#   poshan.appwrite.endpoint=https://<your-host>/v1
#   poshan.appwrite.projectId=<id>
#   poshan.appwrite.databaseId=poshan_db
#   poshan.appwrite.enabled=true
